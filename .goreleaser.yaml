# goreleaser config for the `dop` CLI.
#
# Runtime deps NOT bundled: `sops` and `git`. Install scripts must surface
# these clearly.
version: 2

project_name: dop

before:
  hooks:
    - go mod tidy

builds:
  # v1.11 — darwin split so the Secure Enclave cgo bridge
  # (internal/agentkey/keychain_darwin_cgo.go) gets compiled in.
  # macOS Security.framework is only linkable when building ON macOS,
  # so this only works when goreleaser runs on Apple Silicon.
  #
  # Runs on this dev machine (arm64) — darwin_arm64 gets a real
  # SE-backed binary. darwin_amd64 is cross-compiled from arm64 macOS
  # with cgo, which the built-in clang supports for the same OS.
  - id: dop-darwin
    main: ./cmd/dop
    binary: dop
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/fray/dop/internal/version.Version=v{{.Version}}
      - -X github.com/fray/dop/internal/version.Commit={{.Commit}}
      - -X github.com/fray/dop/internal/version.Date={{.Date}}
    # v1.11.0-rc3 — codesign the darwin binary with hardened runtime.
    # A hardened-runtime signature is a prerequisite for Secure Enclave
    # access, but NOT sufficient on its own:
    #
    #   * Apple Development cert + hardened runtime → SE still returns
    #     errSecMissingEntitlement (-34018). The binary needs a
    #     Developer ID Application cert for SE keys without an App
    #     Store provisioning profile.
    #   * Developer ID Application cert + hardened runtime (+ ideally
    #     notarization for distribution) → SE works.
    #
    # When SE is unreachable at runtime, `dop claim` falls back to
    # legacy ed25519 file storage with a loud stderr warning and
    # `dop doctor` reports the codesign state.
    #
    # DOP_SIGN_IDENTITY is the SHA-1 of a codesigning identity in the
    # local Keychain — see `security find-identity -v -p codesigning`.
    # Skipped silently if the env var isn't set, so `goreleaser
    # release --snapshot` in unattended CI still works.
    hooks:
      post:
        - cmd: sh -c 'if [ -n "$DOP_SIGN_IDENTITY" ]; then codesign --force --sign "$DOP_SIGN_IDENTITY" --options runtime --timestamp "{{ .Path }}" && codesign --display --verbose=2 "{{ .Path }}" 2>&1 | grep -E "Authority|TeamIdentifier"; else echo "[warn] DOP_SIGN_IDENTITY not set — binary will be adhoc-signed and cannot reach Secure Enclave"; fi'
  # Linux stays cgo-free — no SE there anyway, and pure-Go static
  # binaries cross-compile cleanly for both arches.
  - id: dop-linux
    main: ./cmd/dop
    binary: dop
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/fray/dop/internal/version.Version=v{{.Version}}
      - -X github.com/fray/dop/internal/version.Commit={{.Commit}}
      - -X github.com/fray/dop/internal/version.Date={{.Date}}
  # dop-credential-git is a tiny helper — no crypto backend, stays cgo-free.
  - id: dop-credential-git
    main: ./cmd/dop-credential-git
    binary: dop-credential-git
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: dop
    formats: [tar.gz]
    # Bundle both binaries into one archive per (os, arch). The dop
    # binary comes from either dop-darwin or dop-linux depending on
    # goos; goreleaser matches by build id + arch automatically.
    ids:
      - dop-darwin
      - dop-linux
      - dop-credential-git
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - docs/*
      - skills/claude-code/*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: '{{ .Tag }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^chore:'
      - '^style:'
      - '^ci:'

release:
  github:
    owner: untoldecay
    name: dop
  prerelease: auto
