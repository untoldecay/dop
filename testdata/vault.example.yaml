schema_version: 1

integrations:
  boiler:
    description: "Fray Boiler (fixture)"
    metadata:
      base_url: "https://boiler.example.internal"
      admin_email: "cam@example.co"
    tokens:
      read:
        value: "blr_ro_FIXTURE_TOKEN_READ"
        scope_note: "read-only"
      write:
        value: "blr_rw_FIXTURE_TOKEN_WRITE"
        scope_note: "read+write"
  notion:
    description: "Notion workspace (fixture)"
    metadata:
      base_url: "https://api.notion.com/v1"
    tokens:
      read:
        value: "ntn_ro_FIXTURE_TOKEN"
        scope_note: "read-only"

grants:
  boiler.read:
    integration: boiler
    token: read
    env_prefix: BOILER
  boiler.write:
    integration: boiler
    token: write
    env_prefix: BOILER
  notion.read:
    integration: notion
    token: read
    env_prefix: NOTION

auth_tokens:
  tok_p0_readonly:
    name: "walking-skeleton-readonly"
    created_by: "cam@example.co"
    created_at: "2026-09-24"
    grants: [boiler.read, notion.read]
    note: "P0 fixture token for the walking skeleton"
  tok_p0_writer:
    name: "walking-skeleton-writer"
    grants: [boiler.write, notion.read]
